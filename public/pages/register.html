<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crear cuenta | EntradaWeb</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Inter, system-ui, sans-serif;
      color: #172033;
      background: linear-gradient(135deg, #fff7ed, #eef2ff);
    }
    .card {
      width: 100%;
      max-width: 440px;
      padding: 34px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 18px 60px #17203318;
    }
    .brand { color: #ea580c; font-weight: 800; font-size: 24px; }
    h1 { margin: 24px 0 8px; font-size: 28px; }
    .subtitle { color: #64748b; line-height: 1.5; margin-bottom: 26px; }
    label { display: block; margin: 16px 0 7px; font-weight: 600; font-size: 14px; }
    input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font: inherit;
    }
    input:focus {
      outline: 2px solid #fb923c;
      border-color: #ea580c;
    }
    .hint {
      font-size: 12px;
      color: #64748b;
      margin-top: 4px;
    }
    button {
      width: 100%;
      margin-top: 24px;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: #ea580c;
      color: white;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    button:hover { background: #c2410c; }
    button:disabled { opacity: .65; cursor: wait; }
    #mensaje { margin-top: 16px; line-height: 1.5; font-size: 14px; }
    .error { color: #b91c1c; }
    .success { color: #166534; }
    .footer-links {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 24px;
      text-align: center;
      font-size: 14px;
    }
    .footer-links a {
      color: #ea580c;
      text-decoration: none;
      font-weight: 500;
    }
    .footer-links a:hover { text-decoration: underline; }
    .footer-links .back { color: #475569; }
  </style>
</head>
<body>
  <main class="card">
    <a class="brand" href="../index.html" style="text-decoration:none">EntradaWeb</a>
    <h1>Crear cuenta</h1>
    <p class="subtitle">Registrate para comprar entradas y acceder a tus eventos.</p>

    <form id="register-form" novalidate>
      <label for="nombre">Nombre completo</label>
      <input id="nombre" name="nombre" type="text"
             autocomplete="name" required placeholder="Tu nombre y apellido">

      <label for="email">Correo electrónico</label>
      <input id="email" name="email" type="email"
             autocomplete="email" required placeholder="ejemplo@correo.com">

      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password"
             autocomplete="new-password" required minlength="6" placeholder="Mínimo 6 caracteres">
      <div class="hint">Debe tener al menos 6 caracteres.</div>

      <button id="submit" type="submit">Crear cuenta</button>
      <p id="mensaje" role="status" aria-live="polite"></p>
    </form>

    <div class="footer-links">
      <div>¿Ya tenés una cuenta? <a href="./login.html">Iniciar sesión</a></div>
      <a class="back" href="../index.html">← Volver al inicio</a>
    </div>
  </main>

  <script>
    const form = document.getElementById('register-form');
    const button = document.getElementById('submit');
    const message = document.getElementById('mensaje');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      message.textContent = '';
      message.className = '';

      const nombre = document.getElementById('nombre').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!nombre) {
        message.className = 'error';
        message.textContent = 'Por favor ingresá tu nombre completo.';
        document.getElementById('nombre').focus();
        return;
      }

      if (!email || !email.includes('@')) {
        message.className = 'error';
        message.textContent = 'Por favor ingresá un correo electrónico válido.';
        document.getElementById('email').focus();
        return;
      }

      if (!password || password.length < 6) {
        message.className = 'error';
        message.textContent = 'La contraseña debe tener al menos 6 caracteres.';
        document.getElementById('password').focus();
        return;
      }

      button.disabled = true;
      button.textContent = 'Creando cuenta...';

      try {
        // 1. Registrar usuario vía POST /api/usuarios
        const response = await fetch('/api/usuarios', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nombre, email, password })
        });

        const result = await response.json();

        if (!response.ok || result.success !== true) {
          throw new Error(result.message || 'No se pudo crear la cuenta.');
        }

        // 2. Iniciar sesión automáticamente
        const loginRes = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const loginResult = await loginRes.json();

        if (loginRes.ok && loginResult.success && loginResult.data?.token) {
          const { token, user } = loginResult.data;
          sessionStorage.setItem('ew_token', token);
          sessionStorage.setItem('ew_user', JSON.stringify({ user, token }));
          sessionStorage.setItem('entradaweb_token', token);
          sessionStorage.setItem('entradaweb_user', JSON.stringify(user));

          message.className = 'success';
          message.textContent = '¡Cuenta creada con éxito! Redirigiendo...';

          const params = new URLSearchParams(window.location.search);
          const requested = params.get('returnTo') || params.get('redirect') || '../index.html';

          setTimeout(() => {
            window.location.assign(requested);
          }, 800);
        } else {
          // Si el login automático falló, redirigir a login con aviso
          message.className = 'success';
          message.textContent = '¡Cuenta creada! Redirigiendo a inicio de sesión...';
          setTimeout(() => {
            window.location.assign('./login.html?registered=1');
          }, 1000);
        }

      } catch (error) {
        message.className = 'error';
        message.textContent = error.message || 'No se pudo conectar con el servidor.';
      } finally {
        button.disabled = false;
        button.textContent = 'Crear cuenta';
      }
    });
  </script>
</body>
</html>
