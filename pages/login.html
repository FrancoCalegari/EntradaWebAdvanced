<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión | EntradaWeb</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Inter, system-ui, sans-serif;
      color: #172033;
      background: linear-gradient(135deg, #fff7ed, #eef2ff);
    }
    .card {
      width: 100%;
      max-width: 420px;
      padding: 34px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 18px 60px #17203318;
    }
    .brand { color: #ea580c; font-weight: 800; font-size: 24px; }
    h1 { margin: 24px 0 8px; font-size: 28px; }
    .subtitle { color: #64748b; line-height: 1.5; margin-bottom: 26px; }
    label { display: block; margin: 16px 0 7px; font-weight: 600; }
    input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font: inherit;
    }
    input:focus {
      outline: 2px solid #fb923c;
      border-color: #ea580c;
    }
    button {
      width: 100%;
      margin-top: 24px;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: #ea580c;
      color: white;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    button:disabled { opacity: .65; cursor: wait; }
    #mensaje { margin-top: 16px; line-height: 1.5; }
    .error { color: #b91c1c; }
    .success { color: #166534; }
    .back { display: block; margin-top: 22px; text-align: center; color: #475569; }
  </style>
</head>
<body>
  <main class="card">
    <a class="brand" href="../index.html" style="text-decoration:none">EntradaWeb</a>
    <h1>Iniciar sesión</h1>
    <p class="subtitle">Ingresá con tu cuenta para continuar.</p>

    <form id="login-form">
      <label for="email">Correo electrónico</label>
      <input id="email" name="email" type="email"
             autocomplete="username" required>

      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password"
             autocomplete="current-password" required>

      <button id="submit" type="submit">Ingresar</button>
      <p id="mensaje" role="status" aria-live="polite"></p>
    </form>

    <a class="back" href="../index.html">Volver al inicio</a>
  </main>

  <script>
    const form = document.getElementById('login-form');
    const button = document.getElementById('submit');
    const message = document.getElementById('mensaje');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      message.textContent = '';
      message.className = '';
      button.disabled = true;
      button.textContent = 'Ingresando...';

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('email').value.trim(),
            password: document.getElementById('password').value
          })
        });

        const result = await response.json();

        if (!response.ok || result.success !== true || !result.data?.token) {
          throw new Error(result.message || 'No se pudo iniciar sesión.');
        }

        const { token, user } = result.data;
        sessionStorage.setItem('ew_token', token);
        sessionStorage.setItem('ew_user', JSON.stringify({ user, token }));

        const params = new URLSearchParams(window.location.search);
        const requested = params.get('returnTo') || '../index.html';

        // Solo permitir destinos relativos dentro de este mismo sitio.
        const destination = new URL(requested, window.location.href);
        if (destination.origin !== window.location.origin) {
          throw new Error('La dirección de retorno no es válida.');
        }

        const isAdminPage = destination.pathname.endsWith('/admin-showcase.html');

        if (isAdminPage && user?.rol !== 'admin') {
          message.className = 'error';
          message.textContent =
            'Tu sesión se inició, pero tu usuario no tiene permisos de administrador.';
          return;
        }

        message.className = 'success';
        message.textContent = 'Sesión iniciada correctamente.';
        window.location.assign(destination.href);
      } catch (error) {
        message.className = 'error';
        message.textContent = error.message ||
          'No se pudo conectar con el servidor.';
      } finally {
        button.disabled = false;
        button.textContent = 'Ingresar';
      }
    });
  </script>
</body>
</html>
