<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EntradaWeb — Panel de Administración</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/design-tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <style>
    /* ─── ADMIN LAYOUT ─── */
    .admin-wrapper {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .admin-header {
      position: sticky;
      top: 0;
      z-index: var(--z-sticky);
      background: rgba(13,27,42,0.95);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--color-border);
      padding: 0 var(--space-6);
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-4);
    }
    .admin-header__logo {
      font-size: var(--text-xl);
      font-weight: var(--font-weight-bold);
      color: var(--color-text-primary);
      text-decoration: none;
    }
    .admin-header__logo span { color: var(--color-brand-orange); }
    .admin-badge {
      display: inline-flex;
      align-items: center;
      gap: var(--space-2);
      padding: var(--space-1) var(--space-3);
      background: var(--color-brand-orange-muted);
      color: var(--color-brand-orange-light);
      border-radius: var(--radius-full);
      font-size: var(--text-xs);
      font-weight: var(--font-weight-semibold);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .admin-header__actions { display: flex; align-items: center; gap: var(--space-3); }

    /* ─── TAB BAR ─── */
    .admin-tabs {
      background: var(--color-bg-surface);
      border-bottom: 1px solid var(--color-border);
      padding: 0 var(--space-6);
      display: flex;
      gap: 0;
    }
    .admin-tab {
      display: inline-flex;
      align-items: center;
      gap: var(--space-2);
      padding: var(--space-4) var(--space-5);
      font-size: var(--text-sm);
      font-weight: var(--font-weight-medium);
      color: var(--color-text-secondary);
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      cursor: pointer;
      transition: color var(--transition-base), border-color var(--transition-base);
      white-space: nowrap;
    }
    .admin-tab:hover { color: var(--color-text-primary); }
    .admin-tab.is-active {
      color: var(--color-brand-orange);
      border-bottom-color: var(--color-brand-orange);
    }
    .admin-tab svg { flex-shrink: 0; }

    /* ─── TAB CONTENT ─── */
    .admin-content {
      flex: 1;
      padding: var(--space-8) var(--space-6);
      max-width: 1400px;
      width: 100%;
      margin: 0 auto;
    }
    .admin-panel { display: none; }
    .admin-panel.is-active { display: block; }

    /* ─── PANEL: EVENTOS ─── */
    .admin-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-4);
      flex-wrap: wrap;
      margin-bottom: var(--space-6);
    }
    .admin-toolbar__search {
      flex: 1;
      max-width: 360px;
      display: flex;
      align-items: center;
      gap: var(--space-3);
      background: var(--color-bg-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: var(--space-2) var(--space-4);
      transition: border-color var(--transition-base);
    }
    .admin-toolbar__search:focus-within {
      border-color: var(--color-border-focus);
      box-shadow: 0 0 0 3px rgba(37,99,235,0.15);
    }
    .admin-toolbar__search input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      font-size: var(--text-sm);
      color: var(--color-text-primary);
      font-family: var(--font-family-base);
    }
    .admin-toolbar__search input::placeholder { color: var(--color-text-disabled); }
    .admin-toolbar__search svg { color: var(--color-text-secondary); flex-shrink: 0; }

    /* Tabla */
    .admin-table-wrap {
      background: var(--color-bg-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-xl);
      overflow: hidden;
      overflow-x: auto;
    }
    .admin-table {
      width: 100%;
      border-collapse: collapse;
      min-width: 700px;
    }
    .admin-table thead tr {
      background: var(--color-bg-elevated);
    }
    .admin-table th {
      padding: var(--space-3) var(--space-4);
      text-align: left;
      font-size: var(--text-xs);
      font-weight: var(--font-weight-semibold);
      color: var(--color-text-secondary);
      letter-spacing: var(--tracking-wider);
      text-transform: uppercase;
      white-space: nowrap;
    }
    .admin-table td {
      padding: var(--space-4);
      font-size: var(--text-sm);
      color: var(--color-text-primary);
      border-top: 1px solid var(--color-border);
      vertical-align: middle;
    }
    .admin-table tbody tr {
      transition: background var(--transition-fast);
    }
    .admin-table tbody tr:hover {
      background: var(--color-bg-elevated);
    }
    .admin-table__img {
      width: 52px;
      height: 36px;
      object-fit: cover;
      border-radius: var(--radius-sm);
      background: var(--color-bg-elevated);
      display: block;
    }
    .admin-table__actions {
      display: flex;
      align-items: center;
      gap: var(--space-2);
    }
    .admin-btn-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      background: transparent;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      color: var(--color-text-secondary);
      cursor: pointer;
      transition: background var(--transition-base), color var(--transition-base), border-color var(--transition-base);
    }
    .admin-btn-icon:hover { background: var(--color-bg-elevated); color: var(--color-text-primary); }
    .admin-btn-icon--edit:hover { border-color: var(--color-accent-teal); color: var(--color-accent-teal); }
    .admin-btn-icon--delete:hover { border-color: var(--color-error); color: var(--color-error); }
    .admin-table__empty {
      text-align: center;
      padding: var(--space-16) var(--space-4);
      color: var(--color-text-secondary);
    }
    .admin-table__empty p { margin-top: var(--space-3); font-size: var(--text-sm); }

    /* ─── MODAL ─── */
    .admin-modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(13,27,42,0.8);
      backdrop-filter: blur(4px);
      z-index: var(--z-modal);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-4);
      visibility: hidden;
      opacity: 0;
      transition: opacity var(--transition-base), visibility var(--transition-base);
    }
    .admin-modal-backdrop.is-open {
      visibility: visible;
      opacity: 1;
    }
    .admin-modal {
      background: var(--color-bg-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-2xl);
      width: 100%;
      max-width: 560px;
      max-height: 90vh;
      overflow-y: auto;
      transform: scale(0.96) translateY(8px);
      transition: transform var(--transition-base);
    }
    .admin-modal-backdrop.is-open .admin-modal {
      transform: scale(1) translateY(0);
    }
    .admin-modal__header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--space-5) var(--space-6);
      border-bottom: 1px solid var(--color-border);
    }
    .admin-modal__title {
      font-size: var(--text-lg);
      font-weight: var(--font-weight-semibold);
      color: var(--color-text-primary);
    }
    .admin-modal__close {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      background: transparent;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      color: var(--color-text-secondary);
      cursor: pointer;
      transition: background var(--transition-base);
    }
    .admin-modal__close:hover { background: var(--color-bg-elevated); }
    .admin-modal__body { padding: var(--space-6); display: flex; flex-direction: column; gap: var(--space-4); }
    .admin-modal__footer {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: var(--space-3);
      padding: var(--space-4) var(--space-6);
      border-top: 1px solid var(--color-border);
    }

    /* ─── PANEL: CONFIGURACIÓN ─── */
    .config-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: var(--space-6);
    }
    @media (min-width: 768px) {
      .config-grid { grid-template-columns: repeat(2, 1fr); }
    }
    .config-card {
      background: var(--color-bg-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-xl);
      padding: var(--space-6);
    }
    .config-card__title {
      font-size: var(--text-base);
      font-weight: var(--font-weight-semibold);
      color: var(--color-text-primary);
      margin-bottom: var(--space-5);
      padding-bottom: var(--space-3);
      border-bottom: 1px solid var(--color-border);
      display: flex;
      align-items: center;
      gap: var(--space-3);
    }
    .config-card__title svg { color: var(--color-brand-orange); }
    .color-preview-row {
      display: flex;
      align-items: center;
      gap: var(--space-4);
      margin-bottom: var(--space-4);
    }
    .color-swatch {
      width: 48px;
      height: 48px;
      border-radius: var(--radius-lg);
      border: 2px solid var(--color-border);
      flex-shrink: 0;
      cursor: pointer;
    }
    .color-input-row {
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
      flex: 1;
    }
    .social-link-row {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      margin-bottom: var(--space-3);
    }
    .social-link-row svg { color: var(--color-text-secondary); flex-shrink: 0; }
    .social-link-row input { flex: 1; }
    .config-save-bar {
      display: flex;
      justify-content: flex-end;
      gap: var(--space-3);
      margin-top: var(--space-8);
    }

    /* ─── RESPONSIVE ─── */
    @media (max-width: 480px) {
      .admin-content { padding: var(--space-4); }
      .admin-header { padding: 0 var(--space-4); }
      .admin-tabs { padding: 0 var(--space-2); }
    }
  </style>
</head>
<body class="admin-wrapper">

  <a href="#main-content" class="skip-link">Saltar al contenido principal</a>

  <!-- ── HEADER ADMIN ── -->
  <header class="admin-header">
    <a href="../index.html" class="admin-header__logo">Entrada<span>Web</span></a>
    <span class="admin-badge">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      Panel de Administración
    </span>
    <div class="admin-header__actions">
      <a href="../index.html" class="btn btn--ghost btn--sm">← Volver al sitio</a>
    </div>
  </header>

  <!-- ── PESTAÑAS ── -->
  <nav class="admin-tabs" role="tablist" aria-label="Secciones del panel de administración">
    <button
      id="tab-eventos"
      class="admin-tab is-active"
      role="tab"
      aria-selected="true"
      aria-controls="panel-eventos"
    >
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      Eventos
    </button>
    <button
      id="tab-config"
      class="admin-tab"
      role="tab"
      aria-selected="false"
      aria-controls="panel-config"
    >
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93A10 10 0 1 0 4.93 19.07"/><path d="M19.07 4.93l-1.06 1.06"/></svg>
      Configuración
    </button>
  </nav>

  <!-- ══════════════════════════════════════════
       CONTENIDO PRINCIPAL
  ══════════════════════════════════════════ -->
  <main id="main-content" class="admin-content">

    <!-- ────────────────────────────────────────
         PANEL: EVENTOS
    ──────────────────────────────────────── -->
    <div id="panel-eventos" class="admin-panel is-active" role="tabpanel" aria-labelledby="tab-eventos">

      <!-- Toolbar -->
      <div class="admin-toolbar">
        <h1 style="font-size:var(--text-2xl); font-weight:var(--font-weight-bold); color:var(--color-text-primary);">
          Gestión de Eventos
        </h1>
        <div style="display:flex; align-items:center; gap:var(--space-3); flex-wrap:wrap;">
          <!-- Búsqueda -->
          <div class="admin-toolbar__search" role="search">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
            <input
              type="search"
              id="admin-search-eventos"
              placeholder="Buscar por nombre, categoría..."
              aria-label="Buscar eventos"
              autocomplete="off"
            >
          </div>
          <!-- Agregar -->
          <button class="btn btn--orange btn--sm" id="btn-agregar-evento" aria-label="Agregar nuevo evento">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Agregar Evento
          </button>
        </div>
      </div>

      <!-- Tabla de eventos -->
      <div class="admin-table-wrap">
        <table class="admin-table" aria-label="Lista de eventos">
          <thead>
            <tr>
              <th scope="col">Imagen</th>
              <th scope="col">Nombre</th>
              <th scope="col">Categoría</th>
              <th scope="col">Fecha</th>
              <th scope="col">Lugar</th>
              <th scope="col">Precio</th>
              <th scope="col">Estado</th>
              <th scope="col">Acciones</th>
            </tr>
          </thead>
          <tbody id="admin-eventos-tbody">
            <!-- Filas inyectadas por JS -->
            <tr>
              <td colspan="8">
                <div class="admin-table__empty" aria-live="polite">
                  <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" style="margin:0 auto;display:block;color:var(--color-text-disabled)" aria-hidden="true">
                    <rect x="3" y="4" width="18" height="18" rx="2"/>
                    <line x1="16" y1="2" x2="16" y2="6"/>
                    <line x1="8" y1="2" x2="8" y2="6"/>
                    <line x1="3" y1="10" x2="21" y2="10"/>
                  </svg>
                  <p>Cargando eventos...</p>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

    </div><!-- /panel-eventos -->


    <!-- ────────────────────────────────────────
         PANEL: CONFIGURACIÓN
    ──────────────────────────────────────── -->
    <div id="panel-config" class="admin-panel" role="tabpanel" aria-labelledby="tab-config">

      <h1 style="font-size:var(--text-2xl); font-weight:var(--font-weight-bold); color:var(--color-text-primary); margin-bottom:var(--space-6);">
        Configuración del sitio
      </h1>

      <div class="config-grid">

        <!-- ── Color de acento ── -->
        <div class="config-card">
          <h2 class="config-card__title">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v2M12 20v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M2 12h2M20 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
            Color de acento
          </h2>

          <!-- Color principal (naranja) -->
          <div class="color-preview-row">
            <input
              type="color"
              id="color-accent-primary"
              class="color-swatch"
              value="#F97316"
              aria-label="Color de acento principal (naranja)"
              title="Color naranja principal"
            >
            <div class="color-input-row">
              <label class="form-label" for="color-accent-primary-hex">Color principal (naranja de marca)</label>
              <input
                type="text"
                id="color-accent-primary-hex"
                class="form-input"
                value="#F97316"
                maxlength="7"
                placeholder="#F97316"
                aria-label="Valor hexadecimal del color de acento principal"
              >
            </div>
          </div>

          <!-- Color secundario (azul) -->
          <div class="color-preview-row">
            <input
              type="color"
              id="color-accent-secondary"
              class="color-swatch"
              value="#2563EB"
              aria-label="Color de acento secundario (azul)"
              title="Color azul de botones"
            >
            <div class="color-input-row">
              <label class="form-label" for="color-accent-secondary-hex">Color secundario (azul de botones)</label>
              <input
                type="text"
                id="color-accent-secondary-hex"
                class="form-input"
                value="#2563EB"
                maxlength="7"
                placeholder="#2563EB"
                aria-label="Valor hexadecimal del color de acento secundario"
              >
            </div>
          </div>

          <!-- Preview en vivo -->
          <div style="margin-top:var(--space-4); padding:var(--space-4); background:var(--color-bg-elevated); border-radius:var(--radius-lg); display:flex; gap:var(--space-3); align-items:center; flex-wrap:wrap;">
            <span style="font-size:var(--text-xs); color:var(--color-text-secondary);">Preview:</span>
            <span id="preview-logo" style="font-size:var(--text-lg); font-weight:700; color:var(--color-text-primary);">
              Entrada<span id="preview-logo-color" style="color:#F97316;">Web</span>
            </span>
            <button id="preview-btn-primary" class="btn btn--sm" style="background:#F97316; border-color:#F97316; color:#fff; pointer-events:none;">
              Comprar
            </button>
            <button id="preview-btn-secondary" class="btn btn--sm" style="background:#2563EB; border-color:#2563EB; color:#fff; pointer-events:none;">
              Ver evento
            </button>
          </div>
        </div>

        <!-- ── Redes sociales ── -->
        <div class="config-card">
          <h2 class="config-card__title">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
            Links de redes sociales
          </h2>

          <!-- WhatsApp -->
          <div class="social-link-row">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" style="color:#25D366" aria-hidden="true"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M11.999 2C6.477 2 2 6.484 2 12.017c0 1.99.522 3.86 1.433 5.476L2 22l4.626-1.409A9.946 9.946 0 0 0 12 22c5.523 0 10-4.477 10-10S17.523 2 12 2h-.001z"/></svg>
            <div class="form-group" style="flex:1; margin:0;">
              <label class="form-label" for="social-whatsapp">WhatsApp</label>
              <input type="url" id="social-whatsapp" class="form-input" placeholder="https://wa.me/5491100000000" value="">
            </div>
          </div>

          <!-- Instagram -->
          <div class="social-link-row">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="color:#E4405F" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg>
            <div class="form-group" style="flex:1; margin:0;">
              <label class="form-label" for="social-instagram">Instagram</label>
              <input type="url" id="social-instagram" class="form-input" placeholder="https://instagram.com/entradaweb" value="">
            </div>
          </div>

          <!-- X (Twitter) -->
          <div class="social-link-row">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" style="color:#e7e9ea" aria-hidden="true"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
            <div class="form-group" style="flex:1; margin:0;">
              <label class="form-label" for="social-x">X / Twitter</label>
              <input type="url" id="social-x" class="form-input" placeholder="https://x.com/entradaweb" value="">
            </div>
          </div>

          <!-- YouTube -->
          <div class="social-link-row">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" style="color:#FF0000" aria-hidden="true"><path d="M22.54 6.42a2.78 2.78 0 0 0-1.95-1.96C18.88 4 12 4 12 4s-6.88 0-8.59.46a2.78 2.78 0 0 0-1.95 1.96A29 29 0 0 0 1 12a29 29 0 0 0 .46 5.58A2.78 2.78 0 0 0 3.41 19.54C5.12 20 12 20 12 20s6.88 0 8.59-.46a2.78 2.78 0 0 0 1.95-1.96A29 29 0 0 0 23 12a29 29 0 0 0-.46-5.58z"/><polygon points="9.75 15.02 15.5 12 9.75 8.98 9.75 15.02" fill="white"/></svg>
            <div class="form-group" style="flex:1; margin:0;">
              <label class="form-label" for="social-youtube">YouTube</label>
              <input type="url" id="social-youtube" class="form-input" placeholder="https://youtube.com/@entradaweb" value="">
            </div>
          </div>

          <!-- Facebook -->
          <div class="social-link-row">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" style="color:#1877F2" aria-hidden="true"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></svg>
            <div class="form-group" style="flex:1; margin:0;">
              <label class="form-label" for="social-facebook">Facebook</label>
              <input type="url" id="social-facebook" class="form-input" placeholder="https://facebook.com/entradaweb" value="">
            </div>
          </div>

          <!-- Correo de soporte -->
          <div class="social-link-row">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="color:var(--color-accent-teal)" aria-hidden="true"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
            <div class="form-group" style="flex:1; margin:0;">
              <label class="form-label" for="social-email">Correo de soporte</label>
              <input type="email" id="social-email" class="form-input" placeholder="soporte@entradaweb.com.ar" value="">
            </div>
          </div>
        </div>

      </div><!-- /config-grid -->

      <!-- Botones de guardar -->
      <div class="config-save-bar">
        <button class="btn btn--ghost" id="btn-config-reset" type="button">Descartar cambios</button>
        <button class="btn btn--orange" id="btn-config-save" type="button">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
          Guardar cambios
        </button>
      </div>

    </div><!-- /panel-config -->

  </main>


  <!-- ══════════════════════════════════════════
       MODAL — AGREGAR / EDITAR EVENTO
  ══════════════════════════════════════════ -->
  <div
    class="admin-modal-backdrop"
    id="evento-modal-backdrop"
    aria-modal="true"
    role="dialog"
    aria-labelledby="evento-modal-title"
    aria-hidden="true"
  >
    <div class="admin-modal" id="evento-modal">
      <div class="admin-modal__header">
        <h2 class="admin-modal__title" id="evento-modal-title">Agregar Evento</h2>
        <button class="admin-modal__close" id="evento-modal-close" aria-label="Cerrar modal">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>

      <form class="admin-modal__body" id="evento-form" novalidate>
        <input type="hidden" id="evento-id" value="">

        <div class="form-group">
          <label class="form-label form-label--required" for="evento-nombre">Nombre del evento</label>
          <input type="text" id="evento-nombre" class="form-input" placeholder="Ej: Rock en el Parque 2026" required aria-required="true">
        </div>

        <div style="display:grid; grid-template-columns:1fr 1fr; gap:var(--space-4);">
          <div class="form-group">
            <label class="form-label form-label--required" for="evento-categoria">Categoría</label>
            <select id="evento-categoria" class="form-select" required aria-required="true">
              <option value="">Seleccioná...</option>
              <option value="musica">Música</option>
              <option value="teatro">Teatro</option>
              <option value="deportes">Deportes</option>
              <option value="cine">Cine</option>
              <option value="familia">Familia</option>
              <option value="otro">Otro</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label form-label--required" for="evento-fecha">Fecha y hora</label>
            <input type="datetime-local" id="evento-fecha" class="form-input" required aria-required="true">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label form-label--required" for="evento-lugar">Lugar / Venue</label>
          <input type="text" id="evento-lugar" class="form-input" placeholder="Ej: Estadio Vélez Sársfield, Buenos Aires" required aria-required="true">
        </div>

        <div style="display:grid; grid-template-columns:1fr 1fr; gap:var(--space-4);">
          <div class="form-group">
            <label class="form-label" for="evento-precio">Precio mínimo (ARS)</label>
            <input type="number" id="evento-precio" class="form-input" placeholder="0" min="0">
          </div>
          <div class="form-group">
            <label class="form-label" for="evento-estado">Estado</label>
            <select id="evento-estado" class="form-select">
              <option value="disponible">Disponible</option>
              <option value="agotado">Agotado</option>
              <option value="proximo">Próximamente</option>
              <option value="cancelado">Cancelado</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="evento-imagen">URL de imagen</label>
          <input type="url" id="evento-imagen" class="form-input" placeholder="https://...">
        </div>

        <div class="form-group">
          <label class="form-label" for="evento-descripcion">Descripción</label>
          <textarea
            id="evento-descripcion"
            class="form-input"
            rows="3"
            placeholder="Descripción breve del evento..."
            style="resize:vertical; min-height:80px;"
          ></textarea>
        </div>

        <!-- Error general del formulario -->
        <div id="evento-form-error" class="form-error" role="alert" style="display:none;"></div>
      </form>

      <div class="admin-modal__footer">
        <button class="btn btn--ghost btn--sm" id="evento-modal-cancel" type="button">Cancelar</button>
        <button class="btn btn--orange btn--sm" id="evento-form-submit" type="button">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>
          <span id="evento-submit-label">Agregar evento</span>
        </button>
      </div>
    </div>
  </div>


  <!-- ══════════════════════════════════════════
       SCRIPT
  ══════════════════════════════════════════ -->
  <script>
  (function () {
    'use strict';

    /* ─── TABS ─── */
    const tabs   = document.querySelectorAll('.admin-tab');
    const panels = document.querySelectorAll('.admin-panel');

    tabs.forEach(tab => {
      tab.addEventListener('click', () => {
        tabs.forEach(t => { t.classList.remove('is-active'); t.setAttribute('aria-selected', 'false'); });
        panels.forEach(p => p.classList.remove('is-active'));
        tab.classList.add('is-active');
        tab.setAttribute('aria-selected', 'true');
        const target = document.getElementById(tab.getAttribute('aria-controls'));
        target?.classList.add('is-active');
      });
    });

    /* ─── ESTADO LOCAL (mock de eventos) ─── */
    let eventos = [];

    /* ─── TABLA DE EVENTOS ─── */
    const tbody     = document.getElementById('admin-eventos-tbody');
    const searchEl  = document.getElementById('admin-search-eventos');

    function getEstadoBadge(estado) {
      const map = {
        disponible: 'badge--success',
        agotado:    'badge--error',
        proximo:    'badge--warning',
        cancelado:  'badge--default',
      };
      const labels = {
        disponible: 'Disponible',
        agotado:    'Agotado',
        proximo:    'Próximamente',
        cancelado:  'Cancelado',
      };
      const cls = map[estado] || 'badge--default';
      return `<span class="badge ${cls}">${labels[estado] || estado}</span>`;
    }

    function formatDate(iso) {
      if (!iso) return '—';
      try {
        return new Intl.DateTimeFormat('es-AR', { dateStyle: 'medium', timeStyle: 'short' }).format(new Date(iso));
      } catch { return iso; }
    }

    function formatPrice(p) {
      if (!p && p !== 0) return '—';
      if (p === 0) return 'Gratis';
      return new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS', maximumFractionDigits: 0 }).format(p);
    }

    function renderTabla(lista) {
      if (!lista.length) {
        tbody.innerHTML = `
          <tr><td colspan="8">
            <div class="admin-table__empty">
              <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" style="margin:0 auto;display:block;color:var(--color-text-disabled)" aria-hidden="true">
                <rect x="3" y="4" width="18" height="18" rx="2"/>
                <line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/>
                <line x1="3" y1="10" x2="21" y2="10"/>
              </svg>
              <p>No se encontraron eventos.</p>
            </div>
          </td></tr>`;
        return;
      }
      tbody.innerHTML = lista.map(ev => `
        <tr>
          <td>
            ${ev.imagen
              ? `<img src="${ev.imagen}" alt="${ev.nombre}" class="admin-table__img">`
              : `<div class="admin-table__img" style="display:flex;align-items:center;justify-content:center;">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="color:var(--color-text-disabled)" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                </div>`
            }
          </td>
          <td style="font-weight:var(--font-weight-medium); max-width:200px;">${ev.nombre}</td>
          <td style="text-transform:capitalize;">${ev.categoria || '—'}</td>
          <td style="white-space:nowrap;">${formatDate(ev.fecha)}</td>
          <td style="max-width:180px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${ev.lugar || '—'}</td>
          <td style="white-space:nowrap;">${formatPrice(ev.precio)}</td>
          <td>${getEstadoBadge(ev.estado || 'disponible')}</td>
          <td>
            <div class="admin-table__actions">
              <button
                class="admin-btn-icon admin-btn-icon--edit"
                aria-label="Editar ${ev.nombre}"
                data-action="edit"
                data-id="${ev.id}"
                title="Editar"
              >
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
              </button>
              <button
                class="admin-btn-icon admin-btn-icon--delete"
                aria-label="Eliminar ${ev.nombre}"
                data-action="delete"
                data-id="${ev.id}"
                title="Eliminar"
              >
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>
              </button>
            </div>
          </td>
        </tr>
      `).join('');
    }

    function applySearch() {
      const q = (searchEl?.value || '').toLowerCase().trim();
      const filtered = q
        ? eventos.filter(ev =>
            (ev.nombre || '').toLowerCase().includes(q) ||
            (ev.categoria || '').toLowerCase().includes(q) ||
            (ev.lugar || '').toLowerCase().includes(q)
          )
        : eventos;
      renderTabla(filtered);
    }

    searchEl?.addEventListener('input', applySearch);

    /* Delegación de clicks en la tabla */
    tbody.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-action]');
      if (!btn) return;
      const action = btn.dataset.action;
      const id     = btn.dataset.id;
      const ev     = eventos.find(x => String(x.id) === String(id));
      if (!ev) return;

      if (action === 'edit') {
        abrirModal(ev);
      } else if (action === 'delete') {
        if (confirm(`¿Eliminar "${ev.nombre}"? Esta acción no se puede deshacer.`)) {
          eliminarEvento(id);
        }
      }
    });

    /* ─── CARGA DESDE API ─── */
    async function cargarEventos() {
      tbody.innerHTML = `<tr><td colspan="8"><div class="admin-table__empty"><p>Cargando...</p></div></td></tr>`;
      try {
        const res = await fetch('/api/eventos?limit=50', { signal: AbortSignal.timeout(8000) });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        eventos = (Array.isArray(data) ? data : (data.eventos || data.data || [])).map((ev, i) => ({
          id: ev.id || ev._id || i,
          nombre: ev.nombre || ev.titulo || 'Sin nombre',
          categoria: ev.categoria || '',
          fecha: ev.fecha || ev.fecha_inicio || '',
          lugar: ev.lugar || ev.ubicacion || '',
          precio: ev.precio_min || ev.precio || 0,
          estado: ev.estado || 'disponible',
          imagen: ev.imagen || ev.imagen_url || '',
          descripcion: ev.descripcion || '',
        }));
        renderTabla(eventos);
      } catch (err) {
        console.warn('[Admin] No se pudieron cargar eventos:', err.message);
        tbody.innerHTML = `
          <tr><td colspan="8">
            <div class="admin-table__empty">
              <p style="color:var(--color-error);">No se pudo cargar la lista de eventos.</p>
              <button class="btn btn--ghost btn--sm" style="margin-top:var(--space-3);" onclick="window.__adminCargarEventos()">Reintentar</button>
            </div>
          </td></tr>`;
      }
    }

    window.__adminCargarEventos = cargarEventos;
    cargarEventos();

    /* ─── MODAL ─── */
    const backdrop    = document.getElementById('evento-modal-backdrop');
    const modalTitle  = document.getElementById('evento-modal-title');
    const submitLabel = document.getElementById('evento-submit-label');
    const formError   = document.getElementById('evento-form-error');
    let modoEdicion   = false;

    function abrirModal(ev = null) {
      modoEdicion = !!ev;
      modalTitle.textContent  = ev ? 'Editar Evento' : 'Agregar Evento';
      submitLabel.textContent = ev ? 'Guardar cambios' : 'Agregar evento';

      document.getElementById('evento-id').value           = ev?.id ?? '';
      document.getElementById('evento-nombre').value       = ev?.nombre ?? '';
      document.getElementById('evento-categoria').value    = ev?.categoria ?? '';
      document.getElementById('evento-fecha').value        = ev?.fecha ? ev.fecha.slice(0, 16) : '';
      document.getElementById('evento-lugar').value        = ev?.lugar ?? '';
      document.getElementById('evento-precio').value       = ev?.precio ?? '';
      document.getElementById('evento-estado').value       = ev?.estado ?? 'disponible';
      document.getElementById('evento-imagen').value       = ev?.imagen ?? '';
      document.getElementById('evento-descripcion').value  = ev?.descripcion ?? '';
      formError.style.display = 'none';
      formError.textContent   = '';

      backdrop.classList.add('is-open');
      backdrop.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';
      document.getElementById('evento-nombre').focus();
    }

    function cerrarModal() {
      backdrop.classList.remove('is-open');
      backdrop.setAttribute('aria-hidden', 'true');
      document.body.style.overflow = '';
      document.getElementById('btn-agregar-evento')?.focus();
    }

    document.getElementById('btn-agregar-evento')?.addEventListener('click', () => abrirModal());
    document.getElementById('evento-modal-close')?.addEventListener('click', cerrarModal);
    document.getElementById('evento-modal-cancel')?.addEventListener('click', cerrarModal);
    backdrop.addEventListener('click', (e) => { if (e.target === backdrop) cerrarModal(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && backdrop.classList.contains('is-open')) cerrarModal(); });

    /* Submit del modal */
    document.getElementById('evento-form-submit')?.addEventListener('click', async () => {
      const nombre = document.getElementById('evento-nombre').value.trim();
      if (!nombre) {
        formError.textContent = 'El nombre del evento es obligatorio.';
        formError.style.display = 'block';
        document.getElementById('evento-nombre').focus();
        return;
      }

      const payload = {
        nombre,
        categoria: document.getElementById('evento-categoria').value,
        fecha:     document.getElementById('evento-fecha').value,
        lugar:     document.getElementById('evento-lugar').value.trim(),
        precio:    Number(document.getElementById('evento-precio').value) || 0,
        estado:    document.getElementById('evento-estado').value,
        imagen:    document.getElementById('evento-imagen').value.trim(),
        descripcion: document.getElementById('evento-descripcion').value.trim(),
      };

      try {
        const id = document.getElementById('evento-id').value;
        let res;
        if (modoEdicion && id) {
          res = await fetch(`/api/eventos/${id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
          });
        } else {
          res = await fetch('/api/eventos', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
          });
        }

        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.message || `Error ${res.status}`);
        }

        cerrarModal();
        await cargarEventos();
      } catch (err) {
        formError.textContent = `No se pudo guardar: ${err.message}`;
        formError.style.display = 'block';
      }
    });

    /* ─── ELIMINAR EVENTO ─── */
    async function eliminarEvento(id) {
      try {
        const res = await fetch(`/api/eventos/${id}`, { method: 'DELETE' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        await cargarEventos();
      } catch (err) {
        alert(`No se pudo eliminar el evento: ${err.message}`);
      }
    }

    /* ─── CONFIGURACIÓN: COLORES ─── */
    const colorPrimary    = document.getElementById('color-accent-primary');
    const colorPrimaryHex = document.getElementById('color-accent-primary-hex');
    const colorSecondary    = document.getElementById('color-accent-secondary');
    const colorSecondaryHex = document.getElementById('color-accent-secondary-hex');
    const previewLogoColor  = document.getElementById('preview-logo-color');
    const previewBtnPrimary = document.getElementById('preview-btn-primary');
    const previewBtnSecondary = document.getElementById('preview-btn-secondary');

    function updateColorPreview() {
      const p = colorPrimary?.value || '#F97316';
      const s = colorSecondary?.value || '#2563EB';
      if (previewLogoColor)   previewLogoColor.style.color = p;
      if (previewBtnPrimary)  { previewBtnPrimary.style.background = p; previewBtnPrimary.style.borderColor = p; }
      if (previewBtnSecondary){ previewBtnSecondary.style.background = s; previewBtnSecondary.style.borderColor = s; }
    }

    colorPrimary?.addEventListener('input', (e) => {
      if (colorPrimaryHex) colorPrimaryHex.value = e.target.value;
      updateColorPreview();
    });
    colorPrimaryHex?.addEventListener('input', (e) => {
      const v = e.target.value;
      if (/^#[0-9A-Fa-f]{6}$/.test(v) && colorPrimary) colorPrimary.value = v;
      updateColorPreview();
    });

    colorSecondary?.addEventListener('input', (e) => {
      if (colorSecondaryHex) colorSecondaryHex.value = e.target.value;
      updateColorPreview();
    });
    colorSecondaryHex?.addEventListener('input', (e) => {
      const v = e.target.value;
      if (/^#[0-9A-Fa-f]{6}$/.test(v) && colorSecondary) colorSecondary.value = v;
      updateColorPreview();
    });

    /* ─── CONFIGURACIÓN: GUARDAR ─── */
    document.getElementById('btn-config-save')?.addEventListener('click', () => {
      // Por ahora guarda en localStorage como demo
      const config = {
        colorPrimary: colorPrimary?.value,
        colorSecondary: colorSecondary?.value,
        socialWhatsapp:  document.getElementById('social-whatsapp')?.value,
        socialInstagram: document.getElementById('social-instagram')?.value,
        socialX:         document.getElementById('social-x')?.value,
        socialYoutube:   document.getElementById('social-youtube')?.value,
        socialFacebook:  document.getElementById('social-facebook')?.value,
        socialEmail:     document.getElementById('social-email')?.value,
      };
      localStorage.setItem('entradaweb_config', JSON.stringify(config));
      alert('✅ Configuración guardada localmente. Integrá con el backend para persistencia.');
    });

    document.getElementById('btn-config-reset')?.addEventListener('click', () => {
      if (confirm('¿Descartár todos los cambios no guardados?')) location.reload();
    });

    /* Restaurar config guardada */
    try {
      const saved = JSON.parse(localStorage.getItem('entradaweb_config') || '{}');
      if (saved.colorPrimary   && colorPrimary)    colorPrimary.value    = saved.colorPrimary;
      if (saved.colorPrimary   && colorPrimaryHex) colorPrimaryHex.value = saved.colorPrimary;
      if (saved.colorSecondary && colorSecondary)    colorSecondary.value    = saved.colorSecondary;
      if (saved.colorSecondary && colorSecondaryHex) colorSecondaryHex.value = saved.colorSecondary;
      if (saved.socialWhatsapp)  document.getElementById('social-whatsapp').value  = saved.socialWhatsapp;
      if (saved.socialInstagram) document.getElementById('social-instagram').value = saved.socialInstagram;
      if (saved.socialX)         document.getElementById('social-x').value         = saved.socialX;
      if (saved.socialYoutube)   document.getElementById('social-youtube').value   = saved.socialYoutube;
      if (saved.socialFacebook)  document.getElementById('social-facebook').value  = saved.socialFacebook;
      if (saved.socialEmail)     document.getElementById('social-email').value     = saved.socialEmail;
      updateColorPreview();
    } catch {}

  })();
  </script>

</body>
</html>
